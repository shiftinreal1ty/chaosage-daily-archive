    .list{display:grid;gap:5px}.entry{width:100%;display:block;text-align:left;border:1px solid transparent;border-radius:8px;padding:10px 11px;background:transparent;color:var(--ink);cursor:pointer;font:inherit}.entry:hover{background:#f0f5f9}.entry.active{border-color:#bed1e2;background:#e8f3fb}.entry b{display:block;font-weight:620}.entry small{display:block;font-size:13px;color:var(--muted);margin-top:3px}
    .empty{color:var(--muted);padding:20px 5px}.reader{display:flex;flex-direction:column;min-width:0}.readerbar{min-height:70px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:16px;padding:12px 20px}.readerbar h1{font-size:18px;line-height:1.25;margin:0}.readerbar p{font-size:13px;color:var(--muted);margin:3px 0 0}.original{white-space:nowrap;text-decoration:none;color:var(--blue);border:1px solid #bdd0e0;padding:8px 11px;border-radius:8px;font-size:14px}.original:hover{background:#eaf4fc}.reader iframe{width:100%;height:100%;border:0;background:#fff;flex:1}.notice{padding:14px 20px;background:#fff6e8;border-bottom:1px solid #edd6ad;color:#66491e;font-size:14px;display:none}.notice.visible{display:block}
    @media(max-width:820px){header{padding:0 14px}header span{display:none}.layout{display:block;height:auto}nav{border-right:0;border-bottom:1px solid var(--line);padding:14px;max-height:44dvh}.cats{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:thin}.chip{flex:none}.reader{height:calc(56dvh - 64px);min-height:420px}.readerbar{padding:10px 14px}.readerbar h1{font-size:16px}.original{font-size:13px;padding:7px} }
  </style>
</head>

<script>
  const els={cats:document.getElementById('cats'),list:document.getElementById('list'),count:document.getElementById('count'),search:document.getElementById('search'),frame:document.getElementById('article'),title:document.getElementById('title'),subtitle:document.getElementById('subtitle'),original:document.getElementById('original'),notice:document.getElementById('notice')};
  let data,category='all',chosen;
  const safe=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const catName=id=>data.categories.find(c=>c.id===id)?.name||'';
  function render(){
    const term=els.search.value.trim().toLocaleLowerCase('ru');
    const items=data.articles.filter(x=>(category==='all'||(category==='quests'?x.quest:x.categories.includes(category)))&&x.title.toLocaleLowerCase('ru').includes(term));
    els.count.textContent=`${items.length} из ${data.articles.length} доступных статей · проверено ${data.checked_at}`;
    els.cats.innerHTML=[{id:'quests',name:'Все квесты'}, {id:'all',name:'Все'},...data.categories].map(c=>`<button class="chip ${category===c.id?'active':''}" data-cat="${c.id}" aria-pressed="${category===c.id}">${safe(c.name)}</button>`).join('');
    els.list.innerHTML=items.length?items.map(x=>`<button class="entry ${chosen?.url===x.url?'active':''}" data-url="${safe(x.url)}"><b>${safe(x.title)}</b><small>${safe(x.categories.map(catName).join(' · '))}${x.date?' · '+safe(x.date):''}</small></button>`).join(''):'<p class="empty">Ничего не найдено.</p>';
  }
  function select(x,updateHash=true){
    if(!x)return;
    chosen=x;els.title.textContent=x.title;els.subtitle.textContent=x.categories.map(catName).join(' · ')+(x.date?' · '+x.date:'');els.original.href=x.url;els.notice.classList.remove('visible');els.frame.src='./articles/'+new URL(x.url).searchParams.get('p')+'.html';
    if(updateHash)history.replaceState(null,'','#article='+encodeURIComponent(new URL(x.url).searchParams.get('p')||''));
    render();
  }
  els.cats.addEventListener('click',e=>{const b=e.target.closest('[data-cat]');if(!b)return;category=['all','quests'].includes(b.dataset.cat)?b.dataset.cat:Number(b.dataset.cat);render();});
  els.list.addEventListener('click',e=>{const b=e.target.closest('[data-url]');if(b)select(data.articles.find(x=>x.url===b.dataset.url));});
  els.search.addEventListener('input',render);
  Promise.resolve(JSON.parse(document.getElementById('catalog').textContent)).then(d=>{data=d;render();const id=decodeURIComponent(location.hash.match(/article=([^&]+)/)?.[1]||'');category=new URLSearchParams(location.search).get('cat')?Number(new URLSearchParams(location.search).get('cat')):'quests';select(d.articles.find(x=>new URL(x.url).searchParams.get('p')===id)||d.articles.find(x=>x.quest)||d.articles[0]);}).catch(()=>{els.count.textContent='Не удалось открыть каталог';els.list.innerHTML='<p class="empty">Попробуйте обновить страницу.</p>';});
</script>
